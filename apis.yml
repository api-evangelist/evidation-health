aid: evidation-health
name: Evidation Health
description: Evidation Health is a San Mateo, California digital health company, founded in 2012, that
  measures health in everyday life and runs permissioned real-world data research at scale. Its consumer
  app and platform — Achievement — rewards members for connecting wearables, apps and health records,
  and its enterprise Research & Engagement Platform gives life-sciences, payer, government and non-profit
  customers eConsent and onboarding, ePRO and survey capture, passive and active device monitoring, program
  analytics, and participant education. Evidation combines data from sources including Apple Health, Fitbit,
  Garmin, Dexcom and EHR/claims records (via a partnership with 1upHealth's FHIR-based Patient Connect,
  and with HealthVerity), and has enabled 175+ virtual real-world studies and 70+ peer-reviewed publications.
  Evidation publishes no public developer program, API documentation, or machine-readable API contract;
  its programmatic surfaces are the member app backend and enterprise data deliveries, neither of which
  is publicly documented.
